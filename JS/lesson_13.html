<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Форма и её события</h1>
    <!-- form>input*2+button -->
    <form action="" id="loginForm">
      <input
        type="email"
        placeholder="Введите email"
        id="emailInput"
        name="email"
      />
      <input
        type="password"
        placeholder="Введите пароль"
        id="passwordInput"
        name="password"
      />
      <button type="submit" id="loginButton">Войти</button>
      <button id="showPasswordButton">Показать пароль</button>
    </form>

    <script src="./lesson_13.js"></script>
  </body>
